apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-worker
  namespace: ai-video-factory
  labels:
    app: render-worker
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: render-worker
  template:
    metadata:
      labels:
        app: render-worker
        tier: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/ai-video-factory/worker-render:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ai-video-factory-config
            - secretRef:
                name: ai-video-factory-secrets
          env:
            - name: WORKER
              value: "render-worker"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: render-cache
              mountPath: /app/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: render-cache
          emptyDir:
            sizeLimit: 5Gi
