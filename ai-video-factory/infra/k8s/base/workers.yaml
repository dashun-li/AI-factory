apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  namespace: ai-video-factory
  labels:
    app: workflow-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-worker
  template:
    metadata:
      labels:
        app: workflow-worker
        tier: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/ai-video-factory/worker-workflow:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ai-video-factory-config
            - secretRef:
                name: ai-video-factory-secrets
          env:
            - name: WORKER
              value: "workflow-worker"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
