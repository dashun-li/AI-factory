apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-video-factory
  namespace: ai-video-factory
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ai-video-factory.example.com
        - app.ai-video-factory.example.com
      secretName: ai-video-factory-tls
  rules:
    - host: api.ai-video-factory.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
    - host: app.ai-video-factory.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3001
