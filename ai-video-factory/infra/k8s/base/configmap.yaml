apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-video-factory-config
  namespace: ai-video-factory
data:
  NODE_ENV: "production"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "aifactory"
  POSTGRES_DB: "ai_video_factory"
  MILVUS_HOST: "milvus"
  MILVUS_PORT: "19530"
  MINIO_ENDPOINT: "minio"
  MINIO_BUCKET: "videos"
  FASTER_WHISPER_URL: "http://faster-whisper:9001"
  WHISPERX_URL: "http://whisperx:9002"
  NEXT_PUBLIC_API_URL: "http://api:3000"
  NEXT_PUBLIC_WS_URL: "ws://api:3000/workflow"
